<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Achievement Certificate</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 50px;
            color: #172033;
        }

        .document {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 60px;
            border: 1px solid #dbe3ef;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 45px;
        }

        h2 {
            text-align: center;
            margin: 25px 0;
        }

        p {
            font-size: 17px;
            line-height: 1.7;
            text-align: center;
        }

        .placeholder {
            margin-top: 45px;
            font-size: 12px;
            color: #64748b;
        }

        .signature {
            margin-top: 55px;
            text-align: center;
        }

        .signature-line {
            margin: 18px auto 8px;
            width: 240px;
            border-bottom: 1px solid #172033;
        }

        .signature-value {
            font-family: "Brush Script MT", cursive;
            font-size: 30px;
            font-weight: bold;
        }

        .metadata {
            margin-top: 45px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>

<body>

<div class="document">

    
        <h1>Certificate of Achievement</h1>
        <p>This is to certify that</p>
        <h2>karthi</h2>
        <p>has successfully achieved the stated accomplishment.</p>
        <p class="placeholder">
            Fictional demonstration document for Q-SENTRY.
        </p>
        

    <div class="signature">
        <div>Authorized Signature</div>

        <div class="signature-line"></div>

        <div class="signature-value">
            Kai...:
        </div>

        <div>
            Signer: karthi
        </div>
    </div>

    <div class="metadata">
        Generated: 2026-09-20 16:11:48 UTC
    </div>

</div>

</body>
</html>
